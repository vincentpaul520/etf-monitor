name: 510880 红利ETF 盯盘

on:
  schedule:
    # 每个交易日北京时间 15:30 运行（UTC 07:30）
    # GitHub Actions cron 有几分钟延迟，设 15:35 更保险
    - cron: '35 7 * * 1-5'
  workflow_dispatch: # 支持手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写权限来提交 state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: python monitor.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "auto: update monitor state $(date -u +%Y-%m-%d)"
          git push
