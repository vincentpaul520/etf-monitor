name: smtp-probe

on:
  push:
    branches:
      - cursor/fix-gha-smtp-c42b

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check stripped address then one login, no mail
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: |
          python - << 'PY'
          import os, smtplib, string
          email = os.environ.get("QQ_EMAIL", "")
          code = os.environ.get("QQ_SMTP_CODE", "")
          allowed = set(string.ascii_letters + string.digits + "@.")
          odd = [(i, hex(ord(c))) for i, c in enumerate(email) if c not in allowed]
          print("odd_email_chars", odd)
          cleaned = email.strip()
          code_clean = code.strip()
          print("stripped_len", len(cleaned), "code_len", len(code_clean))
          print("suffix_ok", cleaned.endswith("@qq.com") or cleaned.endswith("@foxmail.com"))
          print("charset_ok", set(cleaned) <= allowed and set(code_clean) <= set(string.ascii_letters + string.digits))
          if not (cleaned.endswith("@qq.com") or cleaned.endswith("@foxmail.com")):
              print("skip_login")
              raise SystemExit(0)
          s = smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=20, local_hostname="localhost")
          s.ehlo("localhost")
          try:
              s.login(cleaned, code_clean)
              print("login_ok")
              s.rset()
              s.quit()
          except Exception as e:
              print(type(e).__name__, e)
              try:
                  s.close()
              except Exception:
                  pass
          PY
