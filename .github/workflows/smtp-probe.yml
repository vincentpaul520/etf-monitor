name: smtp-probe

on:
  push:
    branches:
      - cursor/fix-gha-smtp-c42b

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: One real AUTH PLAIN attempt, no mail
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
        run: |
          python - << 'PY'
          import os, smtplib, string
          email = os.environ.get("QQ_EMAIL", "")
          code = os.environ.get("QQ_SMTP_CODE", "")
          allowed = set(string.ascii_letters + string.digits)
          print("email_len", len(email), "code_len", len(code))
          print("email_strip_same", email == email.strip(), "code_strip_same", code == code.strip())
          print("email_alnum_at", set(email) <= allowed | set("@."))
          print("code_alnum", set(code) <= allowed)
          print("email_at", email.count("@"), "email_suffix_ok", email.endswith("@qq.com") or email.endswith("@foxmail.com"))
          s = smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=20, local_hostname="localhost")
          s.ehlo("localhost")
          s.user, s.password = email, code
          try:
              resp = s.auth("PLAIN", s.auth_plain, initial_response_ok=True)
              print("AUTH PLAIN", resp[0], resp[1])
          except Exception as e:
              print(type(e).__name__, e)
          try:
              s.quit()
          except Exception as e:
              print("quit", type(e).__name__, e)
          PY
